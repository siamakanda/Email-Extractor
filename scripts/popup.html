<!DOCTYPE html>
<html>

<head>
  <title>Email Extractor</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

  <div id="top">

    <div class="tile_left">
      <img src="/images/icon48.png" alt="" width="24px" height="24px" id="topimg">
      <span id="totalEmails">Total Emails: 0</span>
    </div>

    <div class="tile_right">
      <button id="darkModeToggle" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </div>

  </div>
  <div class="options-bar">
    <input type="text" id="searchBox" placeholder="Search emails...">
    <input type="text" id="domainFilter" placeholder="Filter by domain">
  </div>
  <!-- <div id="selectAllContainer"> -->
  <div class="options-bar">
    <div class="tile_left">
      <input type="checkbox" id="visibleOnlyCheckbox" checked>
      <label for="visibleOnlyCheckbox">Extract from visible text only</label>
    </div>
    <div class="tile_right">
      <input type="checkbox" id="selectAllCheckbox">
      <label for="selectAllCheckbox">Select All</label>
    </div>
  </div>
  <div id="mainContent">
    <div id="emailList"></div>
    <div id="loadingSpinner" class="hidden"><i class="fa-solid fa-spinner fa-spin"></i></div>
  </div>
  <div id="toastContainer"></div>

  <div class="btn">
    <button class="button-3" id="extractButton">Extract</button>
    <button class="button-3" id="copyButton">Copy Selected</button>
    <button class="button-3" id="saveTxtButton">Save as TXT</button>
    <button class="button-3" id="saveCsvButton">Save as CSV</button>
    <button class="button-3" id="saveJsonButton">Save as JSON</button>
    <button class="button-3" id="clearButton">Clear</button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
