<!DOCTYPE html>
<html>

<head>
  <title>Email Extractor Options</title>
  <link rel="stylesheet" href="styles/style.css">
  <style>
    /* Simple styles for options page */
    body {
      width: 600px;
      height: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--primary-light);
    }

    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
    }

    .option-group {
      margin-bottom: 20px;
    }

    .option-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .option-group p {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }

    body.dark-mode .option-group p {
      color: #aaa;
    }
  </style>
</head>

<body>
  <h1>Email Extractor Options</h1>

  <div class="option-group">
    <label for="blacklist">Custom Blacklist</label>
    <p>Add email patterns (regex) to ignore, one per line. For example, <code>@company.com$</code> or
      <code>^support@</code>.
    </p>
    <textarea id="blacklist"></textarea>
  </div>

  <button class="button-3" id="saveButton">Save Settings</button>
  <div id="toastContainer"></div>

  <script src="utils.js"></script>
  <script src="options.js"></script>
</body>

</html>
